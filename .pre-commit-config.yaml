default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Vendored Spec Kit files are rewritten byte-for-byte by
      # `specify integration upgrade`, so reformatting them here churns on every
      # upgrade. `workflow-registry.json` ships with no final newline. The one file
      # there we author, memory/constitution.md, is still covered by markdownlint
      # (MD009, MD047).
      - id: trailing-whitespace
        exclude: &vendored_speckit ^(\.specify/|\.claude/skills/speckit-)
      - id: end-of-file-fixer
        exclude: *vendored_speckit
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

      # actionlint does not look outside .github/workflows, which is where every
      # composite action in this repo lives.
      - id: zizmor
        name: zizmor
        entry: mise exec -- zizmor --pedantic
        language: system
        pass_filenames: true
        files: ^(\.github/workflows/.*\.ya?ml|actions/.*/action\.ya?ml)$

      # No filenames: taplo.toml's exclude/include decide which TOML is ours.
      - id: taplo-fmt
        name: taplo fmt
        entry: mise exec -- taplo fmt
        language: system
        types: [toml]
        pass_filenames: false

      # .markdownlint-cli2.jsonc owns which rules apply and which files are exempt.
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: mise exec -- markdownlint-cli2
        language: system
        types: [markdown]

      # cspell.config.yaml owns dictionaries and ignored paths. Scoped to the
      # pre-commit stage: `types: [text]` also matches the commit-msg stage's
      # message file, which cspell then fails on ("0 files checked").
      # `--no-must-find-files` covers the same failure inside the pre-commit stage:
      # a batch consisting only of ignorePaths matches (the vendored Spec Kit files)
      # leaves cspell with nothing to check, which is not an error.
      - id: cspell
        name: cspell
        entry: mise exec -- cspell lint --no-progress --no-must-find-files
        language: system
        types: [text]
        stages: [pre-commit]
