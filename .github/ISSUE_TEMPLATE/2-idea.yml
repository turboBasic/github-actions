# Documentation: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms

name: Idea
description: A new workflow or action, or a change to an existing one
title: "feat: "
labels: ["kind:feat"]
body:
  - type: checkboxes
    attributes:
      label: Before filing
      options:
        - label: >-
            I searched the [open and closed
            issues](https://github.com/turboBasic/github-actions/issues?q=is%3Aissue)
            for a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: >
        What you were trying to do, not the solution you have in mind. A workflow here
        earns its place by removing duplication that already exists — say where you saw it.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Rough is fine. A sketched call site says more than prose.
    validations:
      required: false

  - type: input
    id: consumers
    attributes:
      label: Which repositories would use this
      description: >
        One is enough to discuss; two is the bar for extracting something shared. See
        [docs/consumers.md](https://github.com/turboBasic/github-actions/blob/main/docs/consumers.md).
    validations:
      required: false
