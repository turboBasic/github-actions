# The canonical Python CI: mise tasks are the entry point, so what CI runs and what
# `mise run ci` runs locally cannot drift apart.

name: Python CI

on:
  workflow_call:
    inputs:
      mise-version:
        description: Pin the mise release. Empty uses the action's default.
        type: string
        required: false
        default: ""
      run-lint:
        type: boolean
        required: false
        default: true
      run-typecheck:
        type: boolean
        required: false
        default: true
      run-tests:
        type: boolean
        required: false
        default: true
      lint-task:
        description: mise task that lints. Overridable for repos whose task is named differently.
        type: string
        required: false
        default: lint
      typecheck-task:
        type: string
        required: false
        default: typecheck
      test-task:
        type: string
        required: false
        default: test
      lint-changed-only:
        description: >
          Run prek over changed files instead of the lint task. Faster on a large
          tree, but a PR can pass while the tree is broken — pair it with a call to
          precommit-advisory.yml, which is the compensating control.
        type: boolean
        required: false
        default: false
      hook-stage:
        description: >
          prek hook stage for the changed-files run. Empty runs the default stage;
          set pre-push for repos that reserve the slow hooks for it, otherwise those
          hooks silently stop running on PRs. Pass the same value to
          precommit-advisory.yml if you call it.
        type: string
        required: false
        default: ""
      cache-pre-commit:
        type: boolean
        required: false
        default: true
      timeout-minutes:
        type: number
        required: false
        default: 20

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # a consumer may compare against the merge base
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ inputs.mise-version }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Cache prek environments
        if: inputs.cache-pre-commit && inputs.lint-changed-only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            precommit-${{ runner.os }}-

      - name: Get changed files
        if: inputs.lint-changed-only && github.event_name == 'pull_request'
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          base_sha: ${{ github.event.pull_request.base.sha }}

      - name: Lint changed files
        if: >
          inputs.lint-changed-only && github.event_name == 'pull_request'
          && steps.changed.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          HOOK_STAGE: ${{ inputs.hook-stage }}
        run: |
          args=(run --show-diff-on-failure)
          if [ -n "${HOOK_STAGE}" ]; then
            args+=(--stage "${HOOK_STAGE}")
          fi
          # shellcheck disable=SC2086
          mise exec -- prek "${args[@]}" --files $ALL_CHANGED_FILES

      # Task names arrive through env, never inlined into `run:`: an interpolation there
      # is a script-injection sink even when the value looks tame.
      - name: Lint
        if: inputs.run-lint && !(inputs.lint-changed-only && github.event_name == 'pull_request')
        env:
          TASK: ${{ inputs.lint-task }}
        run: mise run "${TASK}"

      - name: Typecheck
        if: inputs.run-typecheck
        env:
          TASK: ${{ inputs.typecheck-task }}
        run: mise run "${TASK}"

      - name: Test
        if: inputs.run-tests
        env:
          TASK: ${{ inputs.test-task }}
        run: mise run "${TASK}"
