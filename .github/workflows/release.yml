# Cuts a release: renders the notes for the commits being released, tags this commit with the version
# `pyproject.toml` declares, publishes the release from those notes, then force-moves the major tag
# consumers pin.
#
# Every decision is a `uses:` of actions/release-decisions — no step here compares a version or reads
# a commit payload. `gh api` and `git-cliff` stay in the workflow because that action does no network
# I/O; its answers arrive as an input path or a string. It is an action rather than a script in this
# repository because `actions/checkout` inside a reusable workflow checks out the *caller's* tree, so
# nothing of ours is on disk.
#
# It never writes the version. `main` requires a pull request and `GITHUB_TOKEN` holds no bypass, so a
# bump pushed from here would be rejected; this tags what the merged bump decided, and refuses if that
# tag already exists.

name: 🌜 release

# No trigger of its own: a caller's `needs:` edge is the only gate, and release-on-merge.yml is this
# repository's caller, on a merge and on a dispatch alike.
on:
  workflow_call:
    inputs:
      dry-run:
        description: Run every refusal and render the real notes, then stop before creating any tag.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false # two of these racing would leave the major tag pointing anywhere

jobs:
  release:
    name: tag-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the version tag, publishes the release, moves the major tag
    env:
      GH_TOKEN: ${{ github.token }}
      # Every `gh` subcommand but `gh api` infers the repository from a git remote, and this checkout
      # is credential-less. One variable rather than a `--repo` per call.
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry-run }}
      # `runner.temp` is not available in a job-level env; the workspace's parent exists, is writable,
      # and is outside the checked-out tree.
      NOTES: ${{ github.workspace }}/../release-notes.md
      CONTEXT: ${{ github.workspace }}/../release-context.json
    steps:
      # Full history and every tag: `--unreleased` measures from the newest tag matching
      # `.cliff.toml`'s `tag_pattern`, and a shallow checkout renders an empty range in silence. No
      # credential, because every write goes through the API rather than the working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # Every major, unfiltered: a frozen major is never backported, only left where it is, so the
      # version being released has to be ahead of the highest release across all of them.
      - name: Read the existing version tags
        id: tags
        run: |
          set -euo pipefail

          {
            echo 'refs<<TAG_REFS'
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref'
            echo 'TAG_REFS'
          } >> "${GITHUB_OUTPUT}"

      # Answers `proceed=false` without failing when the declared version is already tagged, because a
      # caller runs this after every merge and most merges are not releases. README lists every refusal.
      - name: Verify the release
        id: verify
        uses: turboBasic/github-actions/actions/release-decisions@v4
        with:
          decision: verify-version
          tag-refs: ${{ steps.tags.outputs.refs }}
          dry-run: ${{ inputs.dry-run }}

      # From the released repository's own `pyproject.toml`, which is the caller's tree, and
      # deliberately not an input. README's release.yml section is how a caller declares one.
      - name: Read the consumer-surface filter
        id: surface
        if: steps.verify.outputs.proceed == 'true'
        uses: turboBasic/github-actions/actions/release-decisions@v4
        with:
          decision: surface-args

      # Two reads of one range, asking different questions. The notes describe everything that landed;
      # the next step's refusal reads the consumer surface only, because a `!` on a commit touching
      # nothing consumers resolve breaks no contract. release-proposal.yml's increment reads the same
      # definition, which is what makes the two halves agree on what "breaking" means.
      #
      # No commit text reaches a shell line through `${{ }}`: a commit subject is a merged pull request
      # title, which is attacker-influenceable text.
      - name: Render the notes
        if: steps.verify.outputs.proceed == 'true'
        env:
          SURFACE: ${{ steps.surface.outputs.args }}
        run: |
          set -euo pipefail

          # A non-zero exit is a bad range or a bad config and is fatal; a render holding nothing exits
          # 0 and is the next step's refusal.
          git-cliff --unreleased > "${NOTES}"

          # Whitespace-split, which is safe because the action rejects a path holding whitespace.
          read -ra surface <<< "${SURFACE}"
          git-cliff --unreleased --context "${surface[@]}" > "${CONTEXT}"

      # Before any tag exists, so a refusal leaves nothing to clean up.
      - name: Check the notes
        if: steps.verify.outputs.proceed == 'true'
        uses: turboBasic/github-actions/actions/release-decisions@v4
        with:
          decision: check-notes
          notes-file: ${{ env.NOTES }}
          context-file: ${{ env.CONTEXT }}
          current-version: ${{ steps.verify.outputs.version }}
          highest-version: ${{ steps.verify.outputs.highest-version }}

      - name: Show the notes in the run summary
        if: steps.verify.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail

          {
            printf '## Notes for v%s\n\n' "${VERSION}"
            cat "${NOTES}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ ${DRY_RUN} == true ]]; then
            echo "::notice::dry run: the notes above are what a release would publish. No tag is created and no release exists."
          fi

      # The tag is annotated, like every tag already here: it is the artifact consumers resolve, so it
      # carries a tagger and a date rather than being a bare pointer. The major tag moves last, after
      # the release exists, so a failure earlier leaves consumers on the previous release rather than
      # half-way into this one.
      - name: Tag and publish
        if: steps.verify.outputs.proceed == 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          # A decision, so it comes from the action beside the others: under 0.x the ref tracking a
          # compatibility line is `v0.1`, and `${VERSION%%.*}` cannot know that.
          MOVING_TAG: ${{ steps.verify.outputs.moving-tag }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"

          # Before the first ref, because an empty ref name would otherwise fail only after the version
          # tag exists, and the `immutable release tags` ruleset lets nobody delete that.
          if [[ -z ${MOVING_TAG} ]]; then
            echo "::error::the release-decisions action reported no moving-tag, so there is no ref to move. That is what a release cut before the major tag caught up with this workflow looks like. No tag was created."
            exit 1
          fi

          tag_object() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f "tag=$1" -f "message=$2" -f "object=${GITHUB_SHA}" -f type=commit --jq .sha
          }

          cut=$(tag_object "${tag}" "${tag}")
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" --silent \
            -f "ref=refs/tags/${tag}" -f "sha=${cut}"

          gh release create "${tag}" --title "${tag}" --notes-file "${NOTES}" --latest --verify-tag

          # PATCH moves it; the POST is the first release of a new compatibility line, where there is
          # no ref to move yet.
          moved=$(tag_object "${MOVING_TAG}" "${MOVING_TAG} tracks ${tag}")
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${MOVING_TAG}" --silent \
            -f "sha=${moved}" -F force=true ||
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" --silent \
              -f "ref=refs/tags/${MOVING_TAG}" -f "sha=${moved}"

          echo "Released [${tag}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}); \`${MOVING_TAG}\` now resolves to it." >> "${GITHUB_STEP_SUMMARY}"
