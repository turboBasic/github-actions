# Cuts a release: renders the notes from the commits being released, tags this commit with the
# version `pyproject.toml` declares, publishes the release with those notes, then force-moves the
# major tag consumers pin.
#
# The notes are shaped from commit types by `.cliff.toml`, and rendered *before* any tag exists —
# so a failure to produce them leaves no tag behind, and nothing reads a pull request label.
#
# Every decision here is a `uses:` of actions/release-decisions, which answers one release question
# from files and environment variables and exits non-zero to say the caller should not proceed. No
# step compares a version or reads a commit payload. `gh api` and `git-cliff` stay in this file: the
# action does no network I/O, so their results reach it as an input path or a string.
#
# The logic is a composite action rather than a script in this repository because `actions/checkout`
# inside a reusable workflow checks out the *caller's* tree — `github-actions-test` calls this — so
# nothing of ours is on disk. An action's own files arrive with the action download instead.
#
# The version bump is not done here. `main`'s ruleset requires a pull request and bypasses only for
# the Repository admin role, which `GITHUB_TOKEN` does not hold, so a bump commit pushed from here
# would be rejected. It arrives the same way every other change does — reviewed, CI-green — which
# also makes the patch-vs-minor call a one-line diff someone can argue with. This workflow only
# tags what that PR already decided, and refuses if the tag is already there.
#
# The checkout carries no credential. git-cliff needs history to find the range's lower bound, but
# nothing is pushed from the working tree: every write still goes through the API, so no credential
# is left in a workspace for a later step to pick up.

name: 🌜 release

# Called by ci.yml behind `needs: [ci]` on a push to main, which is what makes the CI verdict a
# structural fact rather than something to query: the job cannot start unless `ci / python-ci`
# succeeded on this exact commit. `workflow_run` was the obvious trigger and is not used — zizmor
# rates it a high-severity dangerous trigger, and it would also have meant reading the head SHA out
# of the event payload, because `GITHUB_SHA` under `workflow_run` is the default branch's tip rather
# than the commit CI reported on.
on:
  workflow_call:
    inputs:
      dry-run:
        description: Run every refusal and render the real notes, then stop before creating any tag.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every refusal and render the real notes, then stop before creating any tag.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false # two of these racing would leave the major tag pointing anywhere

jobs:
  release:
    name: tag-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the version tag, publishes the release, moves the major tag
    env:
      GH_TOKEN: ${{ github.token }}
      # Every `gh` subcommand that is not `gh api` infers the repository from a git remote, and the
      # checkout below is deliberately credential-less, so `gh release create` takes its repository
      # from here rather than from the remote. One variable covers every such command rather than a
      # `--repo` per call.
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry-run }}
      # `runner.temp` is not available in a job-level env, so the workspace's parent — which
      # exists and is writable — keeps these out of the checked-out tree.
      NOTES: ${{ github.workspace }}/../release-notes.md
      CONTEXT: ${{ github.workspace }}/../release-context.json
    steps:
      # Full history and every tag: `--unreleased` measures from the newest tag matching
      # `.cliff.toml`'s `tag_pattern`, and a shallow checkout renders an empty range without
      # complaining.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # Every major, unfiltered: a frozen major is never backported, only left where it is, so the
      # version being released has to be ahead of the highest release across all of them. Which ref
      # is the highest, and whether the declared version beats it, is the next step's.
      - name: Read the existing version tags
        id: tags
        run: |
          set -euo pipefail

          {
            echo 'refs<<TAG_REFS'
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref'
            echo 'TAG_REFS'
          } >> "${GITHUB_OUTPUT}"

      # Refuses a run off `main` that is not a dry run, a declared version that is not a plain
      # `N.N.N`, and one that is not ahead of the highest release. That last has three severities
      # keyed on who asked, which is why it can answer `proceed=false` without failing: ci.yml calls
      # this after every merge and most merges are not releases.
      - name: Verify the release
        id: verify
        uses: turboBasic/github-actions/actions/release-decisions@v4
        with:
          decision: verify-version
          tag-refs: ${{ steps.tags.outputs.refs }}
          dry-run: ${{ inputs.dry-run }}

      # `ci / python-ci` is the context the `main` ruleset requires, so on a merged commit it is the
      # verdict that covers this tree. Releasing past it would move the major tag — the ref every
      # consumer resolves — onto code nothing has run. `filter=latest` is the endpoint's default, so
      # a re-run supersedes the run it replaced.
      #
      # Only on the dispatched path. When ci.yml calls this, `needs: [ci]` already *is* the verdict —
      # the job could not have started otherwise — and querying the API for it again would race the
      # check run's own bookkeeping: a conclusion not yet visible would read as `missing` and
      # silently cancel a legitimate release.
      #
      # `drift` is deliberately not consulted, and must not be: it is red precisely when a
      # release is owed, because that is what its drift test asserts. Gating on it would mean a
      # release can only be cut when none is needed.
      #
      # A `gh api` call, so it stays here rather than moving into the action, which does no network
      # I/O. tests/test_action_pins.py asserts the context name is still in this file.
      - name: Verify CI passed on this commit
        if: github.event_name == 'workflow_dispatch' && steps.verify.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "ci / python-ci") | .conclusion] | first // "missing"')
          if [[ ${conclusion} != success ]]; then
            echo "::error::ci / python-ci on ${GITHUB_SHA} is '${conclusion}', not success — the major tag would move onto unverified code"
            exit 1
          fi

      # The consumer surface has one definition, in the action's module, and no workflow spells the
      # flags. The paths are *this* repository's, and deliberately not an input: that would be new
      # contract surface on a reusable workflow nobody has asked for. #61 owns making them one. What
      # writing them in costs a caller under `workflow_call`, in both directions, is README's
      # release.yml section — where a caller reads.
      - name: Read the consumer-surface filter
        id: surface
        if: steps.verify.outputs.proceed == 'true'
        uses: turboBasic/github-actions/actions/release-decisions@v4
        with:
          decision: surface-args

      # Two reads of one range, and they ask different questions. The notes have to describe
      # everything that landed, so they are unfiltered. The refusal in the next step reads the
      # consumer surface only: a `!` on a commit touching nothing consumers resolve breaks no
      # contract, so refusing it would force a major nothing justifies. Same definition as
      # release-proposal.yml's increment, which is what makes the two halves agree on what
      # "breaking" means.
      #
      # No commit text passes through `${{ }}` into a shell line: git-cliff reads git and writes a
      # file, and `gh release create --notes-file` reads that file. A commit subject is a merged
      # pull request title, which is attacker-influenceable text.
      - name: Render the notes
        if: steps.verify.outputs.proceed == 'true'
        env:
          SURFACE: ${{ steps.surface.outputs.args }}
        run: |
          set -euo pipefail

          # A non-zero exit is a bad range or a bad config, and is fatal. It is a different failure
          # from a render holding nothing, which exits 0 — conflating the two would either publish
          # an empty body or refuse a legitimate release because a tag lookup misfired.
          git-cliff --unreleased > "${NOTES}"

          # One line of flags, split on whitespace because no path in the list holds one.
          read -ra surface <<< "${SURFACE}"
          git-cliff --unreleased --context "${surface[@]}" > "${CONTEXT}"

      # Before any tag exists, so a refusal leaves nothing to clean up. Two refusals, both the
      # action's: notes holding no content at all, and a range that breaks the consumer surface under
      # a version that is not a new major.
      - name: Check the notes
        if: steps.verify.outputs.proceed == 'true'
        uses: turboBasic/github-actions/actions/release-decisions@v4
        with:
          decision: check-notes
          notes-file: ${{ env.NOTES }}
          context-file: ${{ env.CONTEXT }}
          current-version: ${{ steps.verify.outputs.version }}
          highest-major: ${{ steps.verify.outputs.highest-major }}

      - name: Show the notes in the run summary
        if: steps.verify.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail

          {
            printf '## Notes for v%s\n\n' "${VERSION}"
            cat "${NOTES}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ ${DRY_RUN} == true ]]; then
            echo "::notice::dry run: the notes above are what a release would publish. No tag is created and no release exists."
          fi

      # Annotated, like every tag already here: the tag is the artifact consumers resolve, so it
      # carries a tagger and a date rather than being a bare pointer.
      #
      # The major tag moves last, after the release exists. It is the only ref consumers resolve,
      # so a failure earlier leaves them on the previous release rather than half-way into this
      # one — recover by bumping to the next patch version and merging that, not by re-running: the
      # `immutable release tags` ruleset covers `refs/tags/v*.*.*` with `bypass_actors: []`, so a
      # version tag this step already created cannot be deleted by anyone, admin included.
      - name: Tag and publish
        if: steps.verify.outputs.proceed == 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"
          major="v${VERSION%%.*}"

          tag_object() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f "tag=$1" -f "message=$2" -f "object=${GITHUB_SHA}" -f type=commit --jq .sha
          }

          cut=$(tag_object "${tag}" "${tag}")
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" --silent \
            -f "ref=refs/tags/${tag}" -f "sha=${cut}"

          # `--notes-file` replaces `--generate-notes`, and `--notes-start-tag` is gone with it:
          # the range is git-cliff's concern now, measured from the previous version *tag* rather
          # than from the previous release, which is what `--generate-notes` alone would have used.
          gh release create "${tag}" --title "${tag}" --notes-file "${NOTES}" --latest --verify-tag

          # PATCH moves it; the POST is for the first release of a new major, where there is no
          # ref to move yet.
          moved=$(tag_object "${major}" "${major} tracks ${tag}")
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" --silent \
            -f "sha=${moved}" -F force=true ||
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" --silent \
              -f "ref=refs/tags/${major}" -f "sha=${moved}"

          echo "Released [${tag}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}); \`${major}\` now resolves to it." >> "${GITHUB_STEP_SUMMARY}"
