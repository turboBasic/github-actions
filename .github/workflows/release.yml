# Cuts a release: renders the notes from the commits being released, tags this commit with the
# version `pyproject.toml` declares, publishes the release with those notes, then force-moves the
# major tag consumers pin.
#
# The notes are shaped from commit types by `.cliff.toml`, and rendered *before* any tag exists —
# so a failure to produce them leaves no tag behind, and nothing reads a pull request label. An
# empty range is not an empty release: git-cliff exits 0 for a range holding nothing, and renders a
# lone newline rather than zero bytes, so the check is for content — never the exit code, never the
# file's size.
#
# The version bump is not done here. `main`'s ruleset requires a pull request and bypasses only for
# the Repository admin role, which `GITHUB_TOKEN` does not hold, so a bump commit pushed from here
# would be rejected. It arrives the same way every other change does — reviewed, CI-green — which
# also makes the patch-vs-minor call a one-line diff someone can argue with. This workflow only
# tags what that PR already decided, and refuses if the tag is already there.
#
# The checkout carries no credential. git-cliff needs history to find the range's lower bound, but
# nothing is pushed from the working tree: every write still goes through the API, so no credential
# is left in a workspace for a later step to pick up.

name: Release

# Called by ci.yml behind `needs: [ci]` on a push to main, which is what makes the CI verdict a
# structural fact rather than something to query: the job cannot start unless `ci / CI` succeeded on
# this exact commit. `workflow_run` was the obvious trigger and is not used — zizmor rates it a
# high-severity dangerous trigger, and it would also have meant reading the head SHA out of the event
# payload, because `GITHUB_SHA` under `workflow_run` is the default branch's tip rather than the
# commit CI reported on.
on:
  workflow_call:
    inputs:
      dry-run:
        description: Run every refusal and render the real notes, then stop before creating any tag.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every refusal and render the real notes, then stop before creating any tag.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false # two of these racing would leave the major tag pointing anywhere

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the version tag, publishes the release, moves the major tag
    env:
      GH_TOKEN: ${{ github.token }}
      # Every `gh` subcommand that is not `gh api` infers the repository from a git remote, and the
      # checkout below is deliberately credential-less, so `gh release create` takes its repository
      # from here rather than from the remote. One variable covers every such command rather than a
      # `--repo` per call.
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry-run }}
      # `runner.temp` is not available in a job-level env, so the workspace's parent — which
      # exists and is writable — keeps the notes file out of the checked-out tree.
      NOTES: ${{ github.workspace }}/../release-notes.md
    steps:
      # Full history and every tag: `--unreleased` measures from the newest tag matching
      # `.cliff.toml`'s `tag_pattern`, and a shallow checkout renders an empty range without
      # complaining.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # `ci / CI` is the context the `main` ruleset requires, so on a merged commit it is the
      # verdict that covers this tree. Releasing past it would move the major tag — the ref every
      # consumer resolves — onto code nothing has run. `filter=latest` is the endpoint's default,
      # so a re-run supersedes the run it replaced.
      #
      # `ci / Live` is deliberately not consulted, and must not be: it is red precisely when a
      # release is owed, because that is what its drift test asserts. Gating on it would mean a
      # release can only be cut when none is needed.
      - name: Verify the release
        id: verify
        run: |
          set -euo pipefail

          if [[ ${GITHUB_REF} != refs/heads/main && ${DRY_RUN} != true ]]; then
            echo "::error::releases are cut from main; this run is on ${GITHUB_REF}. Dispatch with dry-run to exercise this workflow from a branch."
            exit 1
          fi

          # Read as TOML, not as the first `version = ` line: this is a one-shot write path, and
          # positional parsing would take a version from whichever table happened to come first.
          gh api "repos/${GITHUB_REPOSITORY}/contents/pyproject.toml?ref=${GITHUB_SHA}" \
            -H 'Accept: application/vnd.github.raw' > "${RUNNER_TEMP}/pyproject.toml"
          version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "${RUNNER_TEMP}/pyproject.toml")

          if [[ ! ${version} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pyproject.toml declares no plain semantic version: '${version}'"
            exit 1
          fi

          # Must be ahead of every existing release, not merely untagged. A version *below* the
          # current one is untagged too, and tagging it would publish it as latest and move the
          # major tag onto a number consumers read as older than what they already have. Compared
          # across all majors because a frozen major is never backported, only left where it is.
          highest=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' |
            sed 's|^refs/tags/v||' | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [[ -n ${highest} ]]; then
            newest=$(printf '%s\n%s\n' "${version}" "${highest}" | sort -V | tail -1)
            if [[ ${version} == "${highest}" || ${newest} != "${version}" ]]; then
              # Three verdicts for one condition, because what it means depends on who asked.
              #
              # On a push to main it is the ordinary case: ci.yml calls this after *every* merge,
              # and most merges are not releases. Erroring would redden main for doing nothing wrong.
              #
              # Under a dry run it is unavoidable: on a feature branch the declared version is the
              # released one by definition, so erroring would stop every dry run before it rendered
              # anything. Reported, so the rest of the path still runs.
              #
              # Under a real dispatch a human asked for a release, and doing nothing is not what
              # they asked for.
              if [[ ${GITHUB_EVENT_NAME} == push ]]; then
                echo "::notice::v${version} is already released, so this merge cuts nothing. Bump [project].version to release again."
                echo "proceed=false" >> "${GITHUB_OUTPUT}"
                exit 0
              elif [[ ${DRY_RUN} == true ]]; then
                echo "::notice::would refuse: pyproject.toml declares ${version}, which is not ahead of the highest release v${highest}"
              else
                echo "::error::pyproject.toml declares ${version}, which is not ahead of the highest release v${highest}. Bump [project].version in a pull request — that is what decides the next version."
                exit 1
              fi
            fi
          fi

          # Only on the dispatched path. When ci.yml calls this, `needs: [ci]` already *is* the
          # verdict — the job could not have started otherwise — and querying the API for it again
          # would race the check run's own bookkeeping: a conclusion not yet visible would read as
          # `missing` and silently cancel a legitimate release.
          #
          # `ci / Live` is not consulted on either path, and must not be: it is red precisely when a
          # release is owed. That also rules out the workflow-level conclusion of a CI run, which
          # includes `live` — the reason this is a called job rather than a `workflow_run` trigger.
          if [[ ${GITHUB_EVENT_NAME} == workflow_dispatch ]]; then
            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "ci / CI") | .conclusion] | first // "missing"')
            if [[ ${conclusion} != success ]]; then
              echo "::error::ci / CI on ${GITHUB_SHA} is '${conclusion}', not success — the major tag would move onto unverified code"
              exit 1
            fi
          fi

          {
            echo "proceed=true"
            echo "version=${version}"
            echo "highest-major=${highest%%.*}"
          } >> "${GITHUB_OUTPUT}"

      # Before any tag exists, so a failure here leaves nothing to clean up. That ordering is why
      # this is its own step: today's workflow tagged first and generated notes second, so a notes
      # failure left a tag with no release attached.
      #
      # No commit text passes through `${{ }}` into a shell line: git-cliff reads git and writes a
      # file, and `gh release create --notes-file` reads that file. A commit subject is a merged
      # pull request title, which is attacker-influenceable text.
      - name: Render the notes
        if: steps.verify.outputs.proceed == 'true'
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          HIGHEST_MAJOR: ${{ steps.verify.outputs.highest-major }}
        run: |
          set -euo pipefail

          # A non-zero exit is a bad range or a bad config, and is fatal. It is a different failure
          # from the empty render below, which exits 0 — conflating the two would either publish an
          # empty body or refuse a legitimate release because a tag lookup misfired.
          git-cliff --unreleased > "${NOTES}"

          # git-cliff exits 0 for a range holding only a `bump` and for a range holding nothing at
          # all, indistinguishably and with no warning, so the exit code cannot be trusted here.
          # Nor can the file's size: an empty render is one byte, not zero, because git-cliff still
          # emits a trailing newline — measured on a probe branch whose whole range was one `bump`,
          # after this was written as `[[ ! -s ]]` on the assumption of zero bytes. That version
          # would have published a release body containing a blank line.
          if ! grep -q '[^[:space:]]' "${NOTES}"; then
            echo "::error::the range since the previous version tag renders no notes, so there is nothing to release. No tag was created."
            exit 1
          fi

          # `== true` rather than truthiness: `--context` omits `breaking` entirely on a commit
          # matching no Conventional Commit, so the naive form tests a null and answers wrongly.
          breaking=$(git-cliff --unreleased --context | jq 'any(.[].commits[]; .breaking == true)')
          if [[ ${breaking} == true && -n ${HIGHEST_MAJOR} && ${VERSION%%.*} == "${HIGHEST_MAJOR}" ]]; then
            echo "::error::the range contains a breaking change but ${VERSION} is not a new major, so publishing it would move v${HIGHEST_MAJOR} onto a broken contract. No tag was created."
            exit 1
          fi

          {
            printf '## Notes for v%s\n\n' "${VERSION}"
            cat "${NOTES}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ ${DRY_RUN} == true ]]; then
            echo "::notice::dry run: the notes above are what a release would publish. No tag is created and no release exists."
          fi

      # Annotated, like every tag already here: the tag is the artifact consumers resolve, so it
      # carries a tagger and a date rather than being a bare pointer.
      #
      # The major tag moves last, after the release exists. It is the only ref consumers resolve,
      # so a failure earlier leaves them on the previous release rather than half-way into this
      # one — recover by re-running once the cause is fixed, deleting the version tag first if it
      # was already created.
      - name: Tag and publish
        if: steps.verify.outputs.proceed == 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail

          tag="v${VERSION}"
          major="v${VERSION%%.*}"

          tag_object() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f "tag=$1" -f "message=$2" -f "object=${GITHUB_SHA}" -f type=commit --jq .sha
          }

          cut=$(tag_object "${tag}" "${tag}")
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" --silent \
            -f "ref=refs/tags/${tag}" -f "sha=${cut}"

          # `--notes-file` replaces `--generate-notes`, and `--notes-start-tag` is gone with it:
          # the range is git-cliff's concern now, measured from the previous version *tag* rather
          # than from the previous release, which is what `--generate-notes` alone would have used.
          gh release create "${tag}" --title "${tag}" --notes-file "${NOTES}" --latest --verify-tag

          # PATCH moves it; the POST is for the first release of a new major, where there is no
          # ref to move yet.
          moved=$(tag_object "${major}" "${major} tracks ${tag}")
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${major}" --silent \
            -f "sha=${moved}" -F force=true ||
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" --silent \
              -f "ref=refs/tags/${major}" -f "sha=${moved}"

          echo "Released [${tag}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}); \`${major}\` now resolves to it." >> "${GITHUB_STEP_SUMMARY}"
