# Raises and refreshes the release proposal: one pull request from a fixed branch, bumping
# `[project].version` and carrying the notes that version would publish as its body. Merging it is the
# approval, and release.yml takes over from there. CONTRIBUTING's Releasing section is the procedure.
#
# Every decision is a call into actions/release-decisions/decisions.py by in-repo path rather than
# through `uses:`: this workflow has no `workflow_call` trigger, so it only ever runs here and the path
# is always on disk. Every argument reaches it through the environment.
#
# Every write uses a GitHub App installation token, never `GITHUB_TOKEN`, which cannot open a pull
# request while *Allow GitHub Actions to create and approve pull requests* is off — and it stays off.
# CONTRIBUTING's "The App behind the proposal" says why.

name: 🌜 release-proposal

on:
  push:
    branches: [main]
  workflow_dispatch: # recovery, and re-running a refresh by hand

permissions: {}

concurrency:
  group: release-proposal
  cancel-in-progress: true # only the newest range matters

jobs:
  propose:
    name: propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the checkout, and nothing else — every write uses the App token
    env:
      GH_REPO: ${{ github.repository }}
      # `runner.temp` is not available in a job-level env; the workspace's parent exists, is writable,
      # and is outside the checked-out tree.
      NOTES: ${{ github.workspace }}/../release-notes.md
      CONTEXT: ${{ github.workspace }}/../release-context.json
      SCRIPT: actions/release-decisions/decisions.py
      BRANCH: release-proposal
      # The refresh tells its own commits from a reviewer's by author, so it needs an identity this
      # workflow chooses: an App installation token otherwise attributes a commit to `<app-name>[bot]`,
      # which changes if the app is ever renamed or replaced.
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrowed rather than inherited: without these the token carries every permission the
          # installation holds, which zizmor's `github-app` audit rates High. Named here, the two
          # writes are also the documentation of what this workflow can do.
          permission-contents: write
          permission-pull-requests: write

      # Full history and tags, because git-cliff measures the range from the newest version tag. No
      # credential, and none needed: every write goes through the API, so nothing is pushed from the
      # working tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # A push-triggered workflow holding a write token is the shape zizmor's `cache-poisoning`
          # audit is about, and the cache buys a few seconds here.
          cache: false

      # Two reasons not to propose, in order. Both exit 0, and the emptiness check asks at `notice`
      # severity: this runs on every push to main, and a workflow that reddened main whenever a release
      # was not due is one nobody would read.
      - name: Decide whether a proposal is wanted
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SEVERITY: notice
        run: |
          set -euo pipefail

          # The triggering commit's own tree, never the proposal branch: reading the version from there
          # would find this workflow's own bump, conclude a release was already in flight, and stop
          # refreshing the proposal it wrote.
          declared=$(DECISION=declared-version python3 "${SCRIPT}")

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${declared}" >/dev/null 2>&1; then
            echo "::notice::[project].version is ${declared}, which is not tagged yet — a release is already in flight or owed, so there is nothing to propose on top of it."
            echo "wanted=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git-cliff --unreleased > "${NOTES}"

          # Non-zero means the range renders nothing, and the script has already said so.
          if ! NOTES_FILE="${NOTES}" CURRENT_VERSION="${declared}" DECISION=check-notes python3 "${SCRIPT}"; then
            open=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
            if [[ -n ${open} ]]; then
              gh pr close "${open}" --comment "The release range is empty again, so this proposal has nothing to publish." --delete-branch
              echo "::notice::closed the open proposal #${open}; its range no longer describes anything."
            fi
            echo "wanted=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "wanted=true" >> "${GITHUB_OUTPUT}"

      # A reviewer's number outranks a computed one and survives every later refresh. Authorship is the
      # signal because it needs no stored state: this workflow always writes as BOT_NAME, so any other
      # author on the branch is a human who has already decided.
      - name: Decide the version
        id: version
        if: steps.gate.outputs.wanted == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DECLARED: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            human=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${BRANCH}" \
              --jq '.commits[].commit.author.name' |
              { grep -vxF -m1 "${BOT_NAME}" || true; })
            if [[ -n ${human} ]]; then
              gh api "repos/${GITHUB_REPOSITORY}/contents/pyproject.toml?ref=${BRANCH}" \
                -H 'Accept: application/vnd.github.raw' > "${RUNNER_TEMP}/proposed.toml"
              kept=$(PYPROJECT="${RUNNER_TEMP}/proposed.toml" DECISION=declared-version python3 "${SCRIPT}")
              echo "::notice::keeping ${kept}, the version on the proposal branch: it carries a commit by ${human}, so a human has already decided it."
              echo "next-version=${kept}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          # The consumer surface has one definition, in the module. No workflow spells the flags.
          mapfile -t surface < <(DECISION=surface-args python3 "${SCRIPT}")
          git-cliff --unreleased --context "${surface[@]}" > "${CONTEXT}"

          CONTEXT_FILE="${CONTEXT}" CURRENT_VERSION="${DECLARED}" DECISION=next-version python3 "${SCRIPT}"

      # Through the Git Data API: the checkout holds no credential, so there is nothing to push from.
      - name: Write the proposal branch
        if: steps.gate.outputs.wanted == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.next-version }}
        run: |
          set -euo pipefail

          # `uv version` writes `[project].version` and re-locks in one call, so there is no
          # hand-rolled TOML edit and no separate `uv lock`; `--no-sync` skips the virtual environment.
          # uv.lock is not optional: it carries the root package's version, and `uv sync --locked`
          # fails if it disagrees.
          uv version --no-sync "${VERSION}"

          # Every body goes in through stdin: a blob's base64 is past Linux's 128 KiB cap on a single
          # argument, which `uv.lock` exceeds, and `gh`'s `-f` has no syntax for the array of objects a
          # tree is. jq builds the JSON; `--rawfile` keeps the large string off the command line.
          blob() {
            base64 -w0 < "$1" > "${RUNNER_TEMP}/blob.b64"
            jq -n --rawfile content "${RUNNER_TEMP}/blob.b64" \
              '{content: ($content | rtrimstr("\n")), encoding: "base64"}' |
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha
          }
          pyproject_blob=$(blob pyproject.toml)
          lock_blob=$(blob uv.lock)

          base_tree=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq .tree.sha)
          tree=$(jq -n --arg base "${base_tree}" --arg py "${pyproject_blob}" --arg lock "${lock_blob}" \
            '{base_tree: $base, tree: [
               {path: "pyproject.toml", mode: "100644", type: "blob", sha: $py},
               {path: "uv.lock", mode: "100644", type: "blob", sha: $lock}
             ]}' |
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)

          # `bump:` so the squash subject this becomes is excluded from the next range's notes.
          commit=$(jq -n --arg message "bump: release v${VERSION}" --arg tree "${tree}" \
            --arg parent "${GITHUB_SHA}" --arg name "${BOT_NAME}" --arg email "${BOT_EMAIL}" \
            '{message: $message, tree: $tree, parents: [$parent],
              author: {name: $name, email: $email}}' |
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)

          # Force, because a refresh rebuilds the branch from the new tip rather than adding to it.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" --silent \
            -f "sha=${commit}" -F force=true ||
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" --silent \
              -f "ref=refs/heads/${BRANCH}" -f "sha=${commit}"

      # The body is the notes verbatim under one line of preamble, read from the file: no commit text
      # reaches a shell line, and a commit subject is a merged pull request title.
      - name: Open or update the pull request
        if: steps.gate.outputs.wanted == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.next-version }}
        run: |
          set -euo pipefail

          body="${RUNNER_TEMP}/body.md"
          {
            printf 'Merging this publishes **v%s** with exactly these notes. ' "${VERSION}"
            printf 'Change the version here if you disagree with it — the release uses the one you approve.\n\n'
            cat "${NOTES}"
          } > "${body}"

          title="bump: release v${VERSION}"
          open=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [[ -n ${open} ]]; then
            gh pr edit "${open}" --title "${title}" --body-file "${body}"
            echo "::notice::refreshed proposal #${open} for v${VERSION}."
          else
            url=$(gh pr create --base main --head "${BRANCH}" --title "${title}" --body-file "${body}")
            echo "::notice::opened ${url} for v${VERSION}."
          fi

          {
            printf '## Proposed v%s\n\n' "${VERSION}"
            cat "${NOTES}"
          } >> "${GITHUB_STEP_SUMMARY}"
