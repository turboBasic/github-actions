name: 🧩 release-proposal

# Releasing is an act of approval: after a merge, the next version and the exact notes it would publish
# arrive as a pull request, and merging that is what releases. Nothing here creates a tag — it only
# proposes the version a later release reads from the manifest.
#
# `workflow_call` and nothing else, so the App credentials are reachable from no event a fork can raise.
on:
  workflow_call:
    secrets:
      app-client-id:
        description: >-
          The client id of a GitHub App installed on the calling repository with Contents and Pull
          requests write.
        required: true
      app-private-key:
        description: The private key of that same App, in PEM form.
        required: true

permissions: {}

env:
  PROPOSAL_BRANCH: release/next

jobs:
  propose:
    name: propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialised, and never cancelled: two runs racing would both force-move the proposal branch.
    # Grouped by repository, because the caller's workflow name is not ours to know.
    concurrency:
      group: release-proposal-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read # the checkout and the range; every write goes through the App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A backstop, not the ordering itself: a caller racing this against its own release job can still
      # start this before that job's tag exists, and no check made here can wait for a tag that is not
      # there yet — only a `needs:` edge in the caller does that. What this catches is any run, however
      # reached, that lands on a commit a release has already tagged: nothing since that release is
      # proposed twice.
      - id: guard
        name: Decline when this commit already carries a release tag
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          printf 'already-released=%s\n' "${tag:+true}" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            echo "::notice::HEAD already carries the release tag $tag; nothing since that release is proposed"
          fi

      # `minimum_release_age` rather than a pinned version: a task-runner release whose tag exists
      # before its assets do breaks every consumer at once, and waiting a day for one costs nothing.
      # A pinned version would go stale; this does not.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.guard.outputs.already-released != 'true'
        with:
          minimum_release_age: 24h

      - name: Pre-flight the tools this capability invokes
        if: steps.guard.outputs.already-released != 'true'
        uses: $/actions/preflight
        with:
          capability: release-proposal
          tools: git-cliff uv

      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write # the proposal branch and the version on it
          permission-pull-requests: write # opening, refreshing and closing the proposal itself

      # The declared version, the range and its notes are all read from the checkout by the module. One
      # pass over one range decides both the increment and whether there is anything to propose.
      - id: next
        name: Read the range and settle what it would release
        if: steps.guard.outputs.already-released != 'true'
        uses: $/actions/release-decisions
        with:
          decision: next-version

      # An empty range means the last release already covers the default branch, so a standing proposal
      # is stale rather than pending — the same state a commit already carrying a release tag leaves
      # `gather` never having run in, and so never having written `notes.md` at all.
      - id: close
        name: Close a proposal whose range has become empty
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ steps.next.outputs.notes-path }}
        run: |
          # An unset path is the shape a skipped `next` leaves, and it reads as empty for the same reason
          # a rendered file of whitespace does: there is nothing to propose either way.
          empty=false
          [ -n "$NOTES" ] && [ -s "$NOTES" ] && [ -n "$(tr -d '[:space:]' < "$NOTES")" ] || empty=true
          printf 'empty=%s\n' "$empty" >> "$GITHUB_OUTPUT"
          [ "$empty" = true ] || exit 0
          number=$(gh pr list --head "$PROPOSAL_BRANCH" --state open --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            gh pr close "$number" --delete-branch \
              --comment "The range this proposed is now empty, so there is nothing left to release."
          fi
          echo "::notice::the range renders no notes, so no release is proposed"

      - id: version
        name: Settle which version the proposal carries
        if: steps.close.outputs.empty != 'true'
        uses: $/actions/release-decisions
        with:
          decision: proposal-version
          computed-version: ${{ steps.next.outputs.version }}
          proposal-ref: origin/${{ env.PROPOSAL_BRANCH }}
          base-commit: ${{ github.sha }}

      # One commit carrying the manifest and the lockfile together. The lockfile records the project's
      # own version, so moving the manifest without it leaves `uv sync --locked` failing on the proposal
      # branch — which reddens every check on the very pull request whose merge is meant to release. Two
      # writes would also push a transiently broken state and fire a run against it.
      #
      # Built through the git data API rather than pushed: a token in a remote URL would be a secret on a
      # command line, and a persisted credential would be one in a file.
      # `uv` rather than an edit of our own: the lockfile records the project's version, and only the tool
      # that owns the lockfile can move both together.
      - name: Write the settled version into the tree
        if: steps.close.outputs.empty != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv version --no-sync "$VERSION"

      # One commit carrying the manifest and the lockfile together, built through the git data API rather
      # than pushed: a token in a remote URL would be a secret on a command line, and a persisted
      # credential would be one in a file.
      - name: Put the version on the proposal branch
        if: steps.close.outputs.empty != 'true'
        uses: $/actions/release-write
        with:
          command: write-proposal
          token: ${{ steps.token.outputs.token }}
          repository: ${{ github.repository }}
          version: ${{ steps.version.outputs.version }}
          computed-version: ${{ steps.next.outputs.version }}
          commit: ${{ github.sha }}
          branch: ${{ env.PROPOSAL_BRANCH }}

      - name: Open or refresh the proposal
        if: steps.close.outputs.empty != 'true'
        uses: $/actions/release-write
        with:
          command: open-proposal
          token: ${{ steps.token.outputs.token }}
          repository: ${{ github.repository }}
          version: ${{ steps.version.outputs.version }}
          branch: ${{ env.PROPOSAL_BRANCH }}
          base: ${{ github.ref_name }}
          notes: ${{ steps.next.outputs.notes-path }}
