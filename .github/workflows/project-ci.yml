name: 🧩 project-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: The component's directory — where its own task configuration lives.
        type: string
        default: .
      runner-type:
        description: The runner label for jobs.
        type: string
        default: ubuntu-26.04
      run-lint:
        description: Run the lint stage.
        type: boolean
        default: true
      run-build:
        description: Run the build stage.
        type: boolean
        default: true
      run-typecheck:
        description: Run the typecheck stage.
        type: boolean
        default: true
      run-test:
        description: Run the test stage.
        type: boolean
        default: true
      run-coverage:
        description: Run the coverage stage.
        type: boolean
        default: false
      timeout-minutes:
        description: How long the job may run before it is cancelled.
        type: number
        default: 20

# Nothing at workflow level, so the job below is the only thing that names a scope — and a caller
# reading the diff sees the whole demand in one place.
permissions: {}

jobs:
  project-ci:
    name: project-ci
    runs-on: ${{ inputs.runner-type }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # the checkout below; no step here writes anywhere
    steps:
      # Fail when every stage is off; GitHub treats a job with only skipped steps as successful.
      - id: stages
        name: Refuse a call with no stage on
        if: >-
          !inputs.run-lint && !inputs.run-build && !inputs.run-typecheck && !inputs.run-test && !inputs.run-coverage
        run: |
          echo "::error::project-ci was called with all stages disabled, so it has nothing to judge. Switch on the stages this component has, or drop the call and the context requiring it together." >&2
          exit 1

      # No depth: a stage judges the tree as it stands, never a range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          minimum_release_age: 24h

      # For the lint task's hook runner. No input governs it: nobody has wanted a cache off.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.y*ml', 'prek.toml') }}

      # On the stages and on nothing above them: a component's task configuration is resolved from the
      # working directory, while the tree and the tools are the repository's.
      - id: lint
        name: Lint
        if: inputs.run-lint
        working-directory: ${{ inputs.working-directory }}
        run: mise run lint

      - id: build
        name: Build
        if: inputs.run-build
        working-directory: ${{ inputs.working-directory }}
        run: mise run build

      - id: typecheck
        name: Typecheck
        if: inputs.run-typecheck
        working-directory: ${{ inputs.working-directory }}
        run: mise run typecheck

      - id: test
        name: Test
        if: inputs.run-test
        working-directory: ${{ inputs.working-directory }}
        run: mise run test

      - id: coverage
        name: Test coverage
        if: inputs.run-coverage
        working-directory: ${{ inputs.working-directory }}
        run: mise run coverage
