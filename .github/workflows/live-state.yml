name: 🌜 live-state

# GitHub's own state can drift from what the tree assumes with nobody watching: the release App's
# credentials can rotate silently, the compatibility ref can lag a release whose move-ref step never
# ran, and the repository can flip private under a setting nobody meant to touch. A schedule is what
# notices all three without reporting a release in progress as a symptom of itself.
on:
  schedule:
    - cron: "9 7 * * 1" # Monday morning, offset from apply-ruleset's own weekly read
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the checkout, and the live reads below all go through the default token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          minimum_release_age: 24h

      # The primary check this workflow exists for: a broken or rotated credential stops release
      # automation silently, and nothing else here would notice before the next release tries to run.
      - id: token
        name: Mint a token from the release App's own credentials
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read # enough to prove the credential still mints a token, nothing more

      - name: Fail on a credential that no longer mints a token
        if: steps.token.outcome == 'failure'
        run: |
          echo "::error::the release App's credentials no longer mint a token. Release automation (release.yml, release-proposal.yml) depends on this exact App — check whether RELEASE_APP_PRIVATE_KEY was rotated without updating the secret, or whether the App's installation on this repository was removed, in the organisation's GitHub App settings." >&2
          exit 1

      - name: Install from the lockfile
        run: uv sync --locked

      - name: Check the public-visibility and release-ref conditions
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: uv run pytest -m live tests/test_live_state.py
