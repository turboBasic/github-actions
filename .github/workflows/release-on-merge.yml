name: 🌜 release-on-merge

# The dispatch entry point exists to dry-run. Every refusal runs, the real notes render, nothing is
# created. A version tag cannot be withdrawn, so this is the only safe way to exercise the release path.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every refusal and render the notes, then stop before creating anything.
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The verdict has to be structurally true of the commit being tagged, which only a dependency edge
  # gives. A separate workflow reporting green earlier says nothing about this commit.
  verify:
    permissions:
      contents: read # the capability checks this tree out; no step it runs writes anywhere
    uses: $/.github/workflows/project-ci.yml
    with:
      run-build: false # nothing is published from here, as in ci.yml

  release:
    needs: verify
    permissions:
      contents: write # the version tag, the release, and the moving compatibility ref
    uses: $/.github/workflows/release.yml
    with:
      # A push is never a dry run and a dispatch defaults to one, so the destructive path is the one
      # that has to be asked for.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}

  # Behind release, never beside it. release-proposal reads the tag list at checkout, so a push that
  # releases must finish tagging first, or the proposal measures its range against a tag that does not
  # exist. Never on a dispatch: that path promises nothing is created, and this writes a branch and a
  # pull request unconditionally. Job id `proposal` composes the first half of `proposal / propose`.
  proposal:
    needs: release
    if: github.event_name == 'push'
    permissions:
      contents: read # the capability checks this tree out; every write it makes goes through the App token
    uses: $/.github/workflows/release-proposal.yml
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
