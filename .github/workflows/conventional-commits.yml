name: 🧩 conventional-commits

on:
  workflow_call:
    inputs:
      check-title:
        description: >-
          Judge the pull request title. Switching it off skips the job, and a skipped job reports
          success — so retire `pr-title` from the required checks in the same change.
        type: boolean
        default: true
      check-commits:
        description: >-
          Judge every commit message in the pull request range. Switching it off skips the job, so
          retire `commit-messages` from the required checks in the same change.
        type: boolean
        default: true
      types:
        description: >-
          Newline-separated types, and the only thing either check judges against. Never read from a
          calling repository's own commit-tool configuration, because that is what would let the two
          checks reach different verdicts about one word. A default of commitizen's own set, so a
          message the local commit hook accepts cannot fail here.
        type: string
        default: |
          build
          bump
          chore
          ci
          docs
          feat
          fix
          perf
          refactor
          revert
          style
          test

permissions:
  contents: read # the range check reads it from git, so it checks the tree out
  pull-requests: read # the title check reads the title from the API, which needs this at both levels

env:
  # Two check names, so two jobs. A `needs:` edge between them would make one verdict wait on the other.
  # Both call the same action to compile the grammar; only the version is stated here.
  CZ_VERSION: "4.18.0"

jobs:
  pr-title:
    name: pr-title
    # A skipped job reports success, so this pair is registered in the surface fixture's skip table
    # with the reason. Pinning the event also puts `pull_request_target` structurally out of reach:
    # it would run with this repository's token against a fork's text.
    if: inputs.check-title && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # nothing is checked out here, but the grant is what the workflow-level block asks of the caller
      pull-requests: read # the title is read from the API rather than the payload
    steps:
      - name: Provision the commit tool
        run: pipx install "commitizen==$CZ_VERSION"

      - id: grammar
        name: Compile the type list into the grammar this check judges against
        uses: $/actions/commit-grammar
        with:
          types: ${{ inputs.types }}

      - name: Read the pull request title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR_NUMBER" --json title --jq .title > "$RUNNER_TEMP/title"

      - name: Judge the title
        env:
          CZ_CONFIG: ${{ steps.grammar.outputs.config }}
          TYPES: ${{ steps.grammar.outputs.types }}
        run: |
          if ! cz --config "$CZ_CONFIG" check --commit-msg-file "$RUNNER_TEMP/title"; then
            echo "::error::The pull request title does not match the grammar this repository is held to. It read: $(cat "$RUNNER_TEMP/title"). Expected <type>[optional scope][!]: <subject>, where <type> is one of: $TYPES. Edit the title — this check subscribes to edits, so it re-runs by itself." >&2
            exit 1
          fi

  commit-messages:
    name: commit-messages
    if: inputs.check-commits && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the full-history checkout below, so the range can be read from git
    steps:
      # Full history: the range is the base commit to the head commit, and a shallow clone has
      # neither end of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Provision the commit tool
        run: pipx install "commitizen==$CZ_VERSION"

      - id: grammar
        name: Compile the type list into the grammar this check judges against
        uses: $/actions/commit-grammar
        with:
          types: ${{ inputs.types }}

      - name: Judge every commit in the range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CZ_CONFIG: ${{ steps.grammar.outputs.config }}
          TYPES: ${{ steps.grammar.outputs.types }}
        run: |
          if ! cz --config "$CZ_CONFIG" check --rev-range "$BASE_SHA..$HEAD_SHA"; then
            echo "::error::A commit message in this pull request's range does not match the grammar this repository is held to, and the failure above names which. Expected <type>[optional scope][!]: <subject>, where <type> is one of: $TYPES. Reword it and force-push, or squash on merge." >&2
            exit 1
          fi
