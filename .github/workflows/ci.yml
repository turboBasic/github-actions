# Verification only, and that is the whole point of the split: the release lives in
# release-on-merge.yml, so this workflow's verdict — and its badge — answers for the code alone. The
# `push: main` trigger stays, because a squash commit is a tree no pull request run has seen.

name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: $/.github/workflows/python-ci.yml
    permissions:
      contents: read

  # Not a required context: a dependency this repo's own PRs pull in is reviewed the same as any
  # consumer's, but nothing here should block a merge on an advisory a human hasn't triaged yet.
  #
  # `deps` rather than `dependency-review`: the job id is the first half of the check name and the
  # called job's name is the second, so matching them reads `dependency-review / dependency-review`.
  deps:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/dependency-review.yml
    permissions:
      contents: read
