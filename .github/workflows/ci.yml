name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

# The caller owns concurrency; this workflow has triggers of its own, so it is its own caller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Resolves at the commit under review, not at a release: this repository is a real consumer, so a
  # defect fails the pull request introducing it. The id names the component and composes
  # `python / project-ci`; the README says why the component and not the workflow.
  #
  # `$/` carries no `@ref` by design. actionlint does not know the form; `.github/actionlint.yaml` says
  # why that message is ignored rather than the reference respelled.
  python:
    permissions:
      contents: read # the capability checks this tree out; no step it runs writes anywhere
    uses: $/.github/workflows/project-ci.yml
    with:
      run-build: false # nothing is published from here, so there is nothing to compile or package

  # These ran only during a release or a dispatch, so a change breaking one was first reported by a
  # release. Every question below has a fixed answer, never the tree's own state.
  #
  # No checkout, deliberately: `$/` resolves an action from this repository, so a green run is also
  # evidence that each reaches its own code without the caller's tree.
  own-helpers:
    name: own-helpers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: decide
        uses: $/actions/release-decisions
        with:
          decision: moving-ref
          version: "1.2.3"

      - id: grammar
        uses: $/actions/commit-grammar
        with:
          types: |
            feat
            fix

      - name: Check what they answered
        env:
          REF: ${{ steps.decide.outputs.ref }}
          TYPES: ${{ steps.grammar.outputs.types }}
          CONFIG: ${{ steps.grammar.outputs.config }}
        run: |
          failed=0
          [ "$REF" = v1 ] || {
            echo "::error::release-decisions named '$REF' as the moving ref for 1.2.3, and v1 is the only answer at or above the first stable version. Either the compatibility boundary moved, or the action no longer reaches the module it runs." >&2
            failed=1
          }
          [ "$TYPES" = "feat, fix" ] || {
            echo "::error::commit-grammar listed the types as '$TYPES' for the input [feat, fix]. The list is what both grammar checks print in a failure, so compare grammar.py's emit against the input above." >&2
            failed=1
          }
          # `-F`, so the `|` stays data rather than becoming an alternation.
          grep -qF 'feat|fix' "$CONFIG" || {
            echo "::error::commit-grammar wrote no alternation to $CONFIG, so the grammar it compiled matches no commit while looking configured. Check that grammar.py's template still carries its placeholder." >&2
            failed=1
          }
          exit "$failed"
