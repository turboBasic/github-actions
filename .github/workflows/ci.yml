name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: $/.github/workflows/python-ci.yml
    permissions:
      contents: read

  # Separate: needs a token and network, which python-ci.yml gives `mise run test` neither of.
  # Deliberately not a required context — a red check is signal enough here.
  ruleset:
    name: Ruleset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: uv sync --locked
      - env:
          GH_TOKEN: ${{ github.token }} # only to lift the unauthenticated rate limit
        run: mise run test-live
