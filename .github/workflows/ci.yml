# The checks run inline rather than through this repo's own python-ci.yml, which has no
# input for a fourth task and so would skip `lint-schemas`.
#
# Not for the reason once recorded here — that a self-call is always resolved at the
# called ref and would validate a broken change against the last good tag. That is true
# of the `@vN` form only; a relative `./` reference resolves at the caller's own commit,
# which is how commit-messages.yml calls conventional-commits.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: uv sync --locked
      - run: mise run lint
      - run: mise run lint-schemas
      - run: mise run typecheck
      - run: mise run test
