name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

# The caller owns concurrency; this workflow has triggers of its own, so it is its own caller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Resolves at the commit under review rather than at a release, so this repository is a real
  # consumer of the capability and a defect fails the pull request that introduces it. The job id is
  # what composes the first half of the required context, `ci / python-ci`.
  #
  # `$/` carries no `@ref` by design, and actionlint does not know the form yet — .github/actionlint.yaml
  # says why that one message is ignored rather than the reference respelled.
  ci:
    permissions:
      contents: read # the capability checks this tree out; no step it runs writes anywhere
    uses: $/.github/workflows/python-ci.yml
