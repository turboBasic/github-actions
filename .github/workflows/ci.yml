# Calls python-ci.yml relatively, so a change to it is validated by the version under
# review rather than by the last release of itself.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
