name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    uses: $/.github/workflows/python-ci.yml
    permissions:
      contents: read

  # Not a required context: a dependency this repo's own PRs pull in is reviewed the same as any
  # consumer's, but nothing here should block a merge on an advisory a human hasn't triaged yet.
  dependency-review:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/dependency-review.yml
    permissions:
      contents: read

  # The release is a job here rather than a workflow of its own with a `workflow_run` trigger,
  # because `needs: [ci]` *is* the CI verdict: this cannot start unless `ci / CI` succeeded on this
  # exact commit, so there is no check run to query, no API race to lose, and no head SHA to read out
  # of an event payload. zizmor rates `workflow_run` a high-severity dangerous trigger, and this
  # needs no trigger at all.
  #
  # Deliberately not `needs: [ci, drift]`. `drift` is red precisely when a release is owed, so
  # waiting on it would mean a release can only be cut when none is needed.
  #
  # It refuses by itself on every ordinary merge — the declared version is already tagged — and says
  # so with a notice rather than a failure, so this does not redden main for doing nothing wrong.
  release:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/release.yml
    permissions:
      contents: write # creates the version tag, publishes the release, moves the major tag

  # Separate: needs a token and network, which python-ci.yml gives `mise run test` neither of.
  # Deliberately not a required context — a red check is signal enough here.
  drift:
    name: Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: uv sync --locked
      - env:
          GH_TOKEN: ${{ github.token }} # only to lift the unauthenticated rate limit
        run: mise run test-drift
