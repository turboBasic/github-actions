name: 🌜 ci

on:
  push:
    branches: [main]
  pull_request:

# The caller owns concurrency; this workflow has triggers of its own, so it is its own caller.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Resolves at the commit under review rather than at a release, so this repository is a real
  # consumer of the capability and a defect fails the pull request that introduces it. The id names the
  # component and composes `python / project-ci`; the README says why the component and not the workflow.
  #
  # `$/` carries no `@ref` by design, and actionlint does not know the form yet — .github/actionlint.yaml
  # says why that one message is ignored rather than the reference respelled.
  python:
    permissions:
      contents: read # the capability checks this tree out; no step it runs writes anywhere
    uses: $/.github/workflows/project-ci.yml
    with:
      run-build: false # nothing is published from here, so there is nothing to compile or package

  # Without this job, a change breaking a composite action is first reported by a release: nothing a pull
  # request triggers reaches one. The version is a literal with a known answer — 1.2.3 is at or above the
  # first stable version, so its line is the major alone.
  #
  # No checkout, deliberately: `$/` resolves the action from this repository, so a green run is also
  # evidence that the action reaches its own code without the caller's tree.
  composite-action:
    name: composite-action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - id: decide
        uses: $/actions/release-decisions
        with:
          decision: moving-ref
          version: "1.2.3"

      - name: Check the ref it named
        env:
          REF: ${{ steps.decide.outputs.ref }}
        run: |
          [ "$REF" = v1 ] || {
            echo "::error::release-decisions named '$REF' as the moving ref for 1.2.3, and v1 is the only answer above the first stable version. Either the compatibility boundary in decisions.py moved, or the action no longer reaches the module it runs." >&2
            exit 1
          }
