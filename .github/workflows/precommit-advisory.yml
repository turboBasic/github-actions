# Separate from python-ci.yml so that only repositories wanting the PR comment grant
# write access. A called workflow's job permissions are validated when the run starts,
# before any `if:` can skip the job, so a workflow declaring `pull-requests: write`
# anywhere forces every caller to grant it — and a caller that does not gets
# `startup_failure` with no job, no log and no diagnostic.

name: prek advisory

on:
  workflow_call:
    inputs:
      mise-version:
        description: Pin the mise release. Empty uses the action's default.
        type: string
        required: false
        default: ""
      hook-stage:
        description: >
          prek hook stage to run. Empty runs the default stage; set pre-push for
          repos that reserve the slow hooks for it. Match whatever python-ci.yml is
          given, or the two runs disagree about which hooks apply.
        type: string
        required: false
        default: ""
      cache-pre-commit:
        type: boolean
        required: false
        default: true
      timeout-minutes:
        type: number
        required: false
        default: 20

permissions:
  contents: read

jobs:
  advisory:
    name: Advisory lint (all files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write # posts and updates the advisory comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ inputs.mise-version }}

      - name: Sync dependencies
        run: uv sync --locked

      - name: Cache prek environments
        if: inputs.cache-pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            precommit-${{ runner.os }}-

      # Resolves at the moving @v2 even when the caller pins @v2.1.3: a reusable
      # workflow cannot interpolate its own ref into `uses:`.
      - uses: turboBasic/github-actions/actions/precommit-advisory-pr@v2
        with:
          github-token: ${{ github.token }}
          hook-stage: ${{ inputs.hook-stage }}
