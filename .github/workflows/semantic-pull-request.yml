# A squash merge takes its commit subject from the PR title, so the title has to be a
# valid Conventional Commit. ci.yml checks the commits themselves, which is what a
# rebase merge puts on main.
#
# Deliberately not a call to this repo's own conventional-commits.yml: the reference
# would resolve at the tag, so a change to that workflow would be validated by the
# previous version of itself.

name: Semantic pull request

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read # the action reads the PR title from the API

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checks out nothing; reads the title from the event payload.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Spelled out because the action's own default comes from
          # conventional-commit-types, which has eleven types and no `bump`, while
          # ci.yml's `cz check` accepts commitizen's twelve. Squash is the only merge
          # method here, so the title becomes the commit: without `bump`, a release
          # commit could clear the commit check while no valid title could carry it.
          # tests/test_action_pins.py asserts this stays equal to commitizen's set.
          types: |
            build
            bump
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
