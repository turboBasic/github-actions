# Renovate owns version updates here: Dependabot's github-actions ecosystem scans
# .github/workflows plus a root-level action.yml only, so it cannot see actions/*/action.yml
# — which is most of this repository. Renovate matches action.yml at any depth and can
# maintain the `# vX.Y.Z` comment beside a digest pin.
#
# Dependabot is kept for security alerts, which Renovate does not replace and which ignore
# open-pull-requests-limit below. Every PR either tool opens waits for a human; the two tools
# divide the work by what triggers them, not by how the result is merged.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # 0 stops version updates, not security alerts — those ignore this limit.
    open-pull-requests-limit: 0
