# actionlint 1.7.12 reports GitHub's valid `$/` self-repository `uses:` syntax as a malformed call
# (rhysd/actionlint#711). Anchored on the prefix, so a genuinely malformed ref still fails. Delete
# this file when a release closing #711 ships — test_action_pins.py fails when that day comes.
# Why `$/` and not `./`: docs/ai-instructions.md, CI section.
paths:
  .github/workflows/*.yml:
    ignore:
      - 'reusable workflow call "\$/\.github/workflows/.+" at "uses" is not following the format'
