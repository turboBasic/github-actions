# Drives GitHub's own release-note generation: the "Generate release notes" button,
# `gh release create --generate-notes`, and POST /releases/generate-notes.
#
# Categories match on pull request LABELS, not on the Conventional Commit type in the
# title, so an unlabelled PR falls to the catch-all no matter what it is called.

changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: 💥 Breaking changes
      labels: [breaking]
    - title: 🚀 Features
      labels: [enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 📚 Documentation
      labels: [documentation]
    - title: 🚚 CI and dependencies
      labels: [ci, dependencies]
    - title: 🧹 Maintenance
      labels: [chore]
    # Catch-all must come last; it collects everything not matched above.
    - title: Other changes
      labels: ['*']
