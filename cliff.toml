# The notes are built from the commit types in the range, never a label on a pull request. A label is
# applied after the fact and two people label differently; a commit type was chosen by whoever made the
# change and is already gated.
#
# git-cliff publishes no schema for this file. `tests/test_release_notes.py` holds all of it: every type
# the grammar admits reaches a section or a deliberate skip; the six sections keep their titles and order;
# the breaking block leads the body; the tag pattern matches an exact version and never a moving ref. Item
# rules are asserted by rendering into a throwaway repository — a pattern that stopped matching leaves
# this file valid and the body wrong.

[changelog]
header = ""
# A literal string, so the reference test's `\(` reaches Tera rather than reading as a TOML escape.
# Every item ends in a reference a reader can follow: the `(#N)` GitHub appends to a squash subject, or
# the commit's short id. A rebase merge and a hand-edited squash subject both arrive without the `(#N)`.
#
# A breaking change leads the body in its own block and stays in its type's section. The block says a
# consumer cannot absorb this by moving a ref; the section says what the change was. Only the block
# publishes the `BREAKING CHANGE:` footer, and only its first paragraph, on one line.
#
# The reference rule appears twice: Tera has no macro reachable from an inline template. One rule, two
# lines, changed together.
body = '''
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### 💥 Breaking changes
{% for commit in breaking %}
- {{ commit.message | upper_first }}{% if commit.message is not matching("\(#[0-9]+\)") %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}{% if commit.breaking_description and commit.breaking_description != commit.message %} — {{ commit.breaking_description | split(pat="\n\n") | first | split(pat="\n") | join(sep=" ") | trim }}{% endif %}
{%- endfor %}
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.message is not matching("\(#[0-9]+\)") %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}
{%- endfor %}
{% endfor %}'''
footer = ""
trim = true
postprocessors = [
  { pattern = '<!--[0-9]+-->', replace = "" },
  # A bare `@v5` in a release body is an @-mention. GitHub resolves it to whoever holds that login,
  # credits them under Contributors and notifies them. Backticks make it inert and still read as a ref
  # pin. Anchored on a preceding space or bracket, so an address is left alone.
  { pattern = '(?m)(^|[\s(\[])@([A-Za-z0-9][A-Za-z0-9-]*)', replace = '${1}`@${2}`' },
]

[git]
conventional_commits = true
# A non-conventional commit cannot be in the range: both grammar checks are required gates. One arriving
# here means a gate was bypassed, not that the notes should paper over it.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
# Version tags only. A moving ref is also a tag, and matching one starts the range wherever the last
# release moved it rather than at the last release.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

# The `<!--N-->` prefix is the only statement of a section's position, and a postprocessor strips it
# again. Groups are sorted by their string, so without a number the order is alphabetical and
# retitling a section silently moves it.
commit_parsers = [
  { message = "^feat", group = "<!--1-->🚀 Added" },
  { message = "^fix", group = "<!--2-->🐛 Fixed" },
  { message = "^perf", group = "<!--3-->⚡ Performance" },
  { message = "^refactor", group = "<!--4-->♻️ Changed" },
  { message = "^revert", group = "<!--5-->⏪ Reverted" },
  { message = "^docs", group = "<!--6-->📚 Documentation" },
  # Nothing a consumer resolving a ref can observe. A range holding only these renders no notes, and
  # the release is refused for having nothing to publish — which is the right answer, not a gap.
  { message = "^(build|bump|chore|ci|style|test)", skip = true },
]
