version: "0.2"
language: en,en-GB
caseSensitive: false
# Without this, `cspell lint .` silently skips every dot-directory — including
# `.github/` and `.specify/memory/constitution.md`.
enableGlobDot: true

dictionaryDefinitions:
  - name: project
    path: .cspell/project.txt
    description: names, tooling and identifiers specific to this repository
    addWords: true

dictionaries:
  - project
  - bash
  - companies
  - computing-acronyms
  - en-common-misspellings
  - filetypes
  - git
  - python
  - shellscript
  - softwareTerms
  - software-tools

ignorePaths:
  - .git/**
  - .cspell/**
  # Vendored Spec Kit machinery, rewritten by `specify` on every refresh. Listed
  # per-directory rather than as `.specify/**` because `memory/constitution.md`
  # is ours and stays checked; cspell rejects negative globs here.
  - .specify/*.json
  - .specify/integrations/**
  - .specify/memory/.constitution-template.json
  - .specify/scripts/**
  - .specify/templates/**
  - .specify/workflows/**
  - .claude/skills/speckit-*/**
  - tmp/**
  - .ruff_cache/**
  - .pytest_cache/**
  - "**/__pycache__/**"
  - "**/.venv/**"
  - uv.lock
  - "**/*.{png,svg,ico}"

ignoreRegExpList:
  - /\b[0-9a-f]{7,40}\b/ # git object hashes and pinned action SHAs
  - /(?<=https?:\/\/)\S+/ # URLs
  - /op:\/\/\S+/ # 1Password secret references

overrides:
  - filename: "**/*.py"
    dictionaries:
      - python
