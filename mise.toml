[tools]
actionlint = "1.7.12"
# The notes renderer, pinned here because this repository is its own consumer of the release capability.
# A capability never pins a version the repository being released does not control.
git-cliff = "2.14.1"
"npm:cspell" = "10.2.2"
"npm:markdownlint-cli2" = "0.23.2"
"pipx:specify-cli" = "1.0.4"
prek = "0.5.2"
python = "3.14"
# actionlint shells out to shellcheck for every `run:` block when it is on PATH, and silently skips that
# analysis when it is not. Without this pin, `mise run lint` and the `actionlint-system` hook both read
# less than they appear to.
shellcheck = "0.11.0"
taplo = "0.10.0"
uv = "0.12.10"
zizmor = "1.30.0"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install tools, dependencies and git hooks"
run = [
  "mise install",
  "mise run deps",
  "prek install",
]

# A dependency of every stage below, not a step in `project-ci`. The capability invokes a task and
# prepares nothing, so a stage that cannot judge without dependencies says so itself.
[tasks.deps]
description = "Install the locked dependencies"
run = "uv sync --locked"

[tasks.fmt]
description = "Format code with ruff, TOML with taplo"
run = [
  "uv run ruff format .",
  # No `.`. A positional is a glob taplo filters against `include` (default `**/*.toml`), never a
  # directory it walks: `.` matches the directory, which is not a `.toml`, so taplo formats nothing and
  # says nothing. Bare `taplo fmt` uses `include` directly, as the `taplo-fmt` hook does.
  "taplo fmt",
]

# Through the hook runner, not tool by tool. `.pre-commit-config.yaml` already declares every one of
# these; a second list here is a second owner, and the run that reddens a pull request would apply a
# different set from the one a commit fires.
#
# `--skip pyright`: the typecheck task owns it. The hook stays unscoped so a commit still type-checks
# locally, and this keeps one CI job from running it twice.
#
# `--show-diff-on-failure`: a hook that rewrites a file otherwise reports only its own name.
[tasks.lint]
description = "Lint everything the hook runner covers, minus the typecheck task's own hook"
depends = ["deps"]
run = "prek run --all-files --show-diff-on-failure --skip pyright"

[tasks.typecheck]
description = "Type-check with pyright"
depends = ["deps"]
run = "uv run pyright"

[tasks.test]
description = "Run the test suite"
depends = ["deps"]
run = "uv run pytest"

# The entry point every composite action reaches, run against this tree. `PYTHONPATH` rather than a
# console script: nothing is published from here, so `[project.scripts]` would force a build backend for
# an alias.
[tasks.cli]
description = "Run the CLI a composite action runs — `mise run cli -- release-verdict`"
run = "PYTHONPATH=actions python3 -m tbga"

# Not in `ci`, and not because of the network. It needs a full clone with tags: the renderer measures the
# range from the newest version tag and renders an empty one on a shallow checkout without complaining.
# `mise run ci` has to pass there.
[tasks.release-notes]
description = "Render the notes for the unreleased range, offline, creating nothing — needs a full clone with tags"
run = "git-cliff --config cliff.toml --unreleased"

[tasks.ci]
description = "Run everything CI runs, locally"
depends = ["lint", "typecheck", "test"]

# Never `specify self upgrade` — it replaces the binary behind mise's back, leaving
# the committed manifests describing a version nothing here pins. Bump
# `pipx:specify-cli` above, then run this to bring the vendored files with it.
[tasks.spec-kit-upgrade]
description = "Re-sync .specify/ and the speckit skills to the pinned specify-cli"
run = "specify integration upgrade claude"
