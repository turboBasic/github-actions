[project]
name = "turbobasic-github-actions"
version = "0.3.0"
description = "Reusable GitHub Actions workflows for turboBasic repositories"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# Nothing is published from here.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "pyright>=1.1.390",
  "commitizen>=4.17",
  "yamllint>=1.35",
  "check-jsonschema>=0.33",
  # The gates read the workflows and actions as structures. Declared here rather than inherited from
  # yamllint, which would drop it the day yamllint stopped needing it.
  "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["actions", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RUF", # ruff-specific
]
ignore = ["E501"] # line length is the formatter's job

[tool.pyright]
include = ["actions", "tests"]
# What the tests import by bare name: `tests/capabilities.py`, the one owner of how a workflow is read,
# and the `tbga` package both composite actions run. pytest reaches the first by the test file's own
# directory and the second through `tests/conftest.py`; pyright needs both named here.
extraPaths = ["tests", "actions"]
# The runner's interpreter, not mise's, and the default rather than an exception — so a directory added
# under `actions/` inherits the floor instead of needing an entry remembered for it. A composite action
# runs on whichever `python3` the caller left there, 3.12.3 where they pinned none.
#
# A scoped `executionEnvironments` version is the weaker reading: it gates syntax and whether a module
# exists, but a symbol inside a module both versions carry resolves against this top-level value.
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# The suite is the exception: it runs under mise's pin and never on a runner.
[[tool.pyright.executionEnvironments]]
root = "tests"
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not live"]
markers = [
  "live: needs network and a live GitHub API token; deselected by default, run explicitly by live-state.yml",
]

# What a consumer actually resolves, so a release is judged against this layout rather than an inherited
# default. The exclusions are this repository's own call sites: nobody outside names them, so changing one
# breaks nobody.
[tool.turbobasic-release]
include = [".github/workflows", "actions"]
exclude = [
  ".github/workflows/apply-ruleset.yml",
  ".github/workflows/ci.yml",
  ".github/workflows/commit-messages.yml",
  ".github/workflows/dependency-guard.yml",
  ".github/workflows/live-state.yml",
  ".github/workflows/release-on-merge.yml",
  "actions/ruleset-decisions",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
