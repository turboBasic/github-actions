[project]
name = "turbobasic-github-actions"
version = "4.0.6"
description = "Reusable GitHub Actions workflows and composite actions"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# Nothing is published from here; the runtime dependency of the composite actions
# is declared in each action.yml, not installed from this file.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "pyright>=1.1.390",
  "commitizen>=4.17",
  # Not a runtime dep: the composite action installs it via uvx. Here so pyright can
  # resolve the import when checking actions/populate-pr-description/populate.py.
  "jinja2>=3.1",
  "yamllint>=1.35",
  "check-jsonschema>=0.33",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["actions", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RUF", # ruff-specific
]
ignore = ["E501"] # line length is the formatter's job

[tool.pyright]
include = ["actions", "tests"]
# An action's directory is not a package, so `include` alone leaves its module unresolvable and
# every symbol imported from it typed as unknown.
extraPaths = ["actions/release-decisions"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The counterpart of pyright's extraPaths: without it collection fails on the import, and with a
# sys.path shim in the test file pyright would still need its own entry.
pythonpath = ["actions/release-decisions"]
# `drift` is deselected by default so the suite stays offline: `mise run ci` must not depend on
# api.github.com being reachable. `mise run test-drift` opts in, and CI runs it as its own job.
addopts = ["-ra", "-m", "not drift"]
markers = ["drift: asserts GitHub's own state against what the tree declares"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"

# What a consumer of *this* repository resolves, and the only place it is written. Read by
# actions/release-decisions from whichever repository is being released, so a caller declares its own
# layout here rather than inheriting ours — release.yml checks out the caller's tree, so this file is
# the caller's. A repository that declares nothing gets an unfiltered range and is told so.
#
# The exclusions are OWN_CI as workflow paths; tests/test_release_decisions.py holds them equal to it.
# Deleting this table would put this repository's own release on the unfiltered path, so a test
# asserts it exists at all.
[tool.turbobasic-release]
surface-include = [".github/workflows/**", "actions/**"]
surface-exclude = [
  ".github/workflows/ci.yml",
  ".github/workflows/commit-messages.yml",
  ".github/workflows/dependabot-automerge.yml",
  ".github/workflows/drift.yml",
  ".github/workflows/release.yml",
  ".github/workflows/release-proposal.yml",
]
