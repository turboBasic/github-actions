[project]
name = "turbobasic-github-actions"
version = "0.3.0"
description = "Reusable GitHub Actions workflows for turboBasic repositories"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
# Nothing is published from here.
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
  "pyright>=1.1.390",
  "commitizen>=4.17",
  "yamllint>=1.35",
  "check-jsonschema>=0.33",
  # The gates read the workflows and actions as structures. Declared rather than taken from
  # yamllint's own dependency tree, which would drop it the day yamllint stopped needing it.
  "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["actions", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
  "RUF", # ruff-specific
]
ignore = ["E501"] # line length is the formatter's job

[tool.pyright]
include = ["actions", "tests"]
# Modules the tests import by bare name: `tests/capabilities.py`, the one owner of how a workflow is
# read, and each decision unit, which lives beside the action that runs it. pytest reaches the first by
# the test file's own directory and the rest through `tests/conftest.py`; pyright needs every directory
# named here to resolve any of them.
extraPaths = ["tests", "actions/release-decisions", "actions/ruleset-decisions"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

# The one place the two interpreters this repository runs are told apart. Everything here is checked
# against the version mise pins, except what a composite action runs: that executes on whichever
# `python3` the caller's own configuration left on the runner, which is 3.12.3 where they pinned none.
# What this catches is syntax the older interpreter cannot parse. Symbol availability is not gated by
# version, so a stdlib name added after 3.12 is not caught here.
[[tool.pyright.executionEnvironments]]
root = "actions"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-m", "not live"]
markers = [
  "live: needs network and a live GitHub API token; deselected by default, run explicitly by live-state.yml",
]

# What a consumer of this repository actually resolves, so its release is judged against its own layout
# rather than an inherited default. The excluded files are this repository's own callers of its
# capabilities: changing one cannot break anybody, because nobody outside names them.
[tool.turbobasic-release]
include = [".github/workflows", "actions"]
exclude = [
  ".github/workflows/apply-ruleset.yml",
  ".github/workflows/ci.yml",
  ".github/workflows/commit-messages.yml",
  ".github/workflows/dependency-guard.yml",
  ".github/workflows/live-state.yml",
  ".github/workflows/release-on-merge.yml",
  "actions/ruleset-decisions",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
