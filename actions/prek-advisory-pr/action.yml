name: prek-advisory-pr
description: Run prek on all files for PRs as advisory warning with summary and idempotent PR comment

inputs:
  github-token:
    description: GitHub token used to post PR comments
    required: true
  hook-stage:
    description: >
      prek hook stage to run. Empty runs the default stage; set pre-push for
      repos that reserve the slow hooks for that stage.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run prek on all files (advisory on PR)
      id: prek
      shell: bash
      env:
        HOOK_STAGE: ${{ inputs.hook-stage }}
      run: |
        args=(run --show-diff-on-failure --all-files)
        if [ -n "${HOOK_STAGE}" ]; then
          args+=(--stage "${HOOK_STAGE}")
        fi

        set +e
        mise exec -- prek "${args[@]}"
        status=$?
        set -e

        if [ "$status" -ne 0 ]; then
          echo "failed=true" >> "$GITHUB_OUTPUT"
        else
          echo "failed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish advisory warning for PR all-files lint
      if: steps.prek.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::warning title=Non-blocking prek warning::prek failed on --all-files for this PR. See advisory step logs for details."
        {
          echo "### Non-blocking prek warning"
          echo
          echo "prek failed on --all-files for this PR."
          echo
          echo "This is advisory and does not fail the pipeline."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on PR for advisory all-files lint failure
      if: steps.prek.outputs.failed == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          if (!context.issue.number) {
            core.info('No PR context available. Skipping advisory comment.');
            return;
          }

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const marker = '<!-- precommit-all-files-advisory -->';
          const body = [
            marker,
            '### Non-blocking prek warning',
            '',
            'prek failed on `--all-files` for this PR.',
            '',
            'This is advisory and does not fail the pipeline.',
            '',
            `Details: ${runUrl}`,
          ].join('\n');

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });

          const existing = comments.find((c) =>
            c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker),
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
