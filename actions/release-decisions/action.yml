name: release-decisions
description: >-
  Answers one release question from values the caller puts in the environment. Internal surface: it
  carries no stability promise and composes no check name. It is the one thing in this repository named
  by owner and moving ref, because a reusable workflow runs its checkout against the caller's tree and
  cannot interpolate its own ref — so it can reach neither its own files nor the ref a consumer pinned.

inputs:
  repository:
    description: >-
      The tree to read the range from. Every value the refusals compare comes from here, so nothing about
      the range travels through an output and back.
    required: false
    default: ""
  cliff-config:
    description: The notes renderer's config, relative to the repository.
    required: false
    default: cliff.toml
  notes-path:
    description: Where to write the rendered notes. The release body is read from this file, never an output.
    required: false
    default: ""
  decision:
    description: Which question to answer — moving-ref, next-version, release-verdict, or proposal-version.
    required: true
  version:
    description: >-
      The version the manifest declares, as a plain N.N.N with no leading v. Read from the repository for
      release-verdict; still passed for the decisions that judge a version the tree does not hold.
    required: false
    default: ""
  branch:
    description: The branch the run is on. Compared against the default branch, never a literal name.
    required: false
    default: ""
  default-branch:
    description: The repository's actual default branch, read from the run.
    required: false
    default: ""
  occasion:
    description: >-
      How the run was reached — routine, dry-run, or deliberate. The already-released condition means
      something different for each, so it is not a boolean.
    required: false
    default: deliberate
  manifest:
    description: >-
      Path to the manifest holding the surface declaration. Absent means every path counts, which
      refuses more often rather than less.
    required: false
    default: pyproject.toml
  proposal-ref:
    description: >-
      The proposal branch as a ref this checkout can resolve, for the proposal-version decision. A ref
      that does not exist yet reads the same as a branch declaring no version.
    required: false
    default: ""
  base-commit:
    description: The commit the proposal branch is measured from, for the proposal-version decision.
    required: false
    default: ""
  computed-version:
    description: The version this run would propose absent an override, for the proposal-version decision.
    required: false
    default: ""

outputs:
  notes-path:
    description: The file the rendered notes were written to. Empty when nothing was rendered.
    value: ${{ steps.decide.outputs.notes-path }}
  ref:
    description: The moving ref the version belongs to.
    value: ${{ steps.decide.outputs.ref }}
  version:
    description: The incremented or settled version, depending on the decision.
    value: ${{ steps.decide.outputs.version }}
  proceed:
    description: Whether every refusal passed. Not permission to create a ref — a dry run proceeds too.
    value: ${{ steps.decide.outputs.proceed }}
  severity:
    description: notice or error. A decline is a notice, so a routine merge does not redden.
    value: ${{ steps.decide.outputs.severity }}
  message:
    description: What was read, what it was compared against, and what to do about it.
    value: ${{ steps.decide.outputs.message }}

runs:
  using: composite
  steps:
    # Every value reaches the module as an environment value. None of it is interpolated into the
    # command line, because a version, a branch name and a set of notes are all text chosen outside
    # this repository.
    - id: decide
      shell: bash
      env:
        # `$/` puts the whole repository beside this action, so the package resolves from the action
        # path's parent — which exists because the action directory does. Nothing is installed here and
        # nothing needs to be: the package imports the standard library only.
        PYTHONPATH: ${{ github.action_path }}/..
        DECISION: ${{ inputs.decision }}
        REPO_DIR: ${{ inputs.repository || github.workspace }}
        CLIFF_CONFIG: ${{ inputs.cliff-config }}
        NOTES_PATH: ${{ inputs.notes-path || format('{0}/release-notes.md', runner.temp) }}
        VERSION: ${{ inputs.version }}
        BRANCH: ${{ inputs.branch }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        OCCASION: ${{ inputs.occasion }}
        MANIFEST: ${{ inputs.manifest }}
        PROPOSAL_REF: ${{ inputs.proposal-ref }}
        BASE_COMMIT: ${{ inputs.base-commit }}
        COMPUTED: ${{ inputs.computed-version }}
      # The decision reaches argparse as an environment value the shell expands into one argument, so a
      # caller's text is never part of this line.
      run: python3 -m tbga "$DECISION"
