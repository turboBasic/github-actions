# The committed published surface: one table per capability, keyed by the capability's own file
# stem. `test_published_surface.py` asserts the tree matches this file exactly — a capability here
# that the tree lacks fails, and a capability in the tree that is missing here fails too.
#
# This is principle IV's gate. Renaming a check, adding an input or raising a permission are all
# one-word edits that read as cosmetic in review and cannot be diagnosed from a consumer's side; each
# now arrives as a deliberate diff to this file as well.
#
# Fields:
#
#   kind                "workflow" or "action". A workflow composes check names; an action does not.
#   published           false marks internal surface carrying no stability promise. An unpublished
#                       capability's inputs are not compared — nothing outside this repository names
#                       them.
#   check_name          the called jobs' names, which are the second half of what a consumer requires
#                       in a ruleset. Absent for an action. A list rather than a string, because one
#                       capability publishes two jobs and so two required contexts.
#   inputs              every declared input, by name. Names only: a default stated here would be a
#                       second owner of a fact the capability YAML already owns.
#   secrets             every declared `workflow_call` secret, by name. Absent means none. A required
#                       secret a caller does not pass fails the run before any job exists, as a
#                       permission shortfall does.
#   permissions         scope to level, as a caller must grant it for the run to *start*. Validated
#                       before any job exists, so a shortfall yields no job and no log — which is why
#                       the demand is compared surface and not merely documented.
#   tool_prerequisites  tools the capability invokes that the consumer's own configuration must pin.
#                       Empty when the capability provisions its own.
#   skips_under         every event-conditional job-level `if:`, as `{ jobs, event, reason }`. One
#                       entry may cover several jobs that skip for the same reason. Documentation of
#                       the condition, not itself a reason to refuse a required context: a caller that
#                       only ever fires under the one event the job does not skip is unaffected by it.
#   judges              false marks a capability whose job goes green without judging what it names —
#                       advisory (reports success regardless of findings) or write-only (nothing to
#                       pass or fail). Absent means true. This is what a required context is refused
#                       for; `skips_under` alone is not enough to tell the two apart.
#
# Each row arrives in the same change as the capability it describes.

[python-ci]
kind = "workflow"
published = true
check_name = ["python-ci"]
inputs = [
  "hook-stage",
  "lint-changed-only",
  "lint-task",
  "run-lint",
  "run-tests",
  "run-typecheck",
  "test-task",
  "timeout-minutes",
  "typecheck-task",
]
permissions = { contents = "read" }
tool_prerequisites = [
  "uv — the lockfile check invokes it directly",
  "the tasks named by lint-task, typecheck-task and test-task",
  "prek — only while lint-changed-only is on",
]
skips_under = []

[conventional-commits]
kind = "workflow"
published = true
# Two jobs, so two contexts a consumer requires separately — and switching either check off means
# retiring its context in the same change, or the ruleset keeps naming a gate that no longer reports.
check_name = ["commit-messages", "pr-title"]
inputs = ["check-commits", "check-title", "types"]
permissions = { contents = "read", pull-requests = "read" }
tool_prerequisites = []

[[conventional-commits.skips_under]]
jobs = ["pr-title", "commit-messages"]
event = "any event but pull_request"
reason = "there is no title and no range to judge; a consumer must not require these contexts for another event"

[release]
kind = "workflow"
published = true
check_name = ["tag-and-publish"]
inputs = ["dry-run"]
# The only write in the published set, and the reason this capability is separate from every other.
permissions = { contents = "write" }
tool_prerequisites = [
  "git-cliff — the notes renderer, invoked to render the range",
]
skips_under = []

[release-proposal]
kind = "workflow"
published = true
check_name = ["propose"]
# It writes a branch and a pull request; there is no criterion by which either passes or fails.
judges = false
inputs = []
secrets = ["app-client-id", "app-private-key"]
# Read only: every write goes through the App installation token minted inside the job.
permissions = { contents = "read" }
tool_prerequisites = [
  "git-cliff — the notes renderer, invoked to render the proposed range",
  "uv — the version write invokes it, and the lockfile has to move with the manifest",
]
skips_under = []

[prek-advisory]
kind = "workflow"
published = true
check_name = ["prek-advisory"]
# Its own lint step swallows a non-zero exit; the job reports success whether or not it found anything.
judges = false
# No cache-prek: caching is unconditional. No mise-version: six call sites could have set it and none
# did, and removing an input is a break where never adding one is not.
inputs = ["hook-stage", "timeout-minutes"]
# The write is the whole reason this is a capability of its own. A workflow demanding it anywhere forces
# every caller to grant it, so keeping it separate is what lets a consumer take python-ci without
# granting write access to its pull requests.
permissions = { contents = "read", pull-requests = "write" }
tool_prerequisites = [
  "uv — the lockfile check invokes it directly",
  "prek — the hook runner this capability exists to run",
]

[[prek-advisory.skips_under]]
jobs = ["prek-advisory"]
event = "any event but pull_request"
reason = "there is no pull request to comment on. This capability is advertised as advisory rather than as a required gate, which is why principle VII exempts it by name — a consumer that requires this context has misread what it is for"

[dependency-review]
kind = "workflow"
published = true
check_name = ["dependency-review"]
inputs = ["fail-on-severity"]
permissions = { contents = "read" }
tool_prerequisites = []

[[dependency-review.skips_under]]
jobs = ["dependency-review"]
event = "any event but pull_request"
reason = "there is no base and no head to difference, so there is nothing to judge"

[ruleset-decisions]
kind = "action"
# Internal surface, for the same reason release-decisions is: no stability promise, no check name, and
# inputs nothing outside this repository names.
published = false
inputs = []
permissions = {}
tool_prerequisites = []
skips_under = []

[release-decisions]
kind = "action"
# Internal surface: no stability promise, no check name, and inputs nothing outside this repository
# names — so they are deliberately not compared. Listing them here would be a second owner that can
# drift from `action.yml` in silence, since no gate reads it.
published = false
inputs = []
permissions = {}
tool_prerequisites = []
skips_under = []
